<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURE MATCH | Secure by Q</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Background Q -->
    <div class="background-q">
        <img src="{{ url_for('static', filename='images/only_q.png') }}" alt="">
    </div>

    <nav class="main-nav">
        <div class="container">
            <div class="nav-content">
                <div class="logo-container">
                    <span class="logo-text">SECURE MATCH</span>
                </div>
                <ul class="nav-links">
                    <li><a href="{{ url_for('index') }}"><i class="fas fa-home"></i> Dashboard</a></li>
                    <li><a href="{{ url_for('brokers.broker_index') }}"><i class="fas fa-building"></i> Brokers</a></li>
                    <li><a href="{{ url_for('candidates.candidate_index') }}"><i class="fas fa-users"></i> Candidates</a></li>
                    <li><a href="{{ url_for('matching.matching_dashboard') }}"><i class="fas fa-handshake"></i> Matches</a></li>
                </ul>
            </div>
        </div>
    </nav>

    {% block hero %}
    <header class="hero">
        <div class="container">
            <div class="hero-content">
                <h1>MATCH<br>SECURE<br>DELIVER</h1>
                <p class="subtitle">Internal talent matching platform for Secure by Q, powered by intelligent matching algorithms.</p>
                <div class="hero-footer">
                    <img src="{{ url_for('static', filename='images/small_logo.png') }}" alt="Secure by Q" class="logo-image">
                </div>
            </div>
        </div>
    </header>
    {% endblock %}

    <main class="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">
                    <img src="{{ url_for('static', filename='images/small_logo.png') }}" alt="Secure by Q" class="footer-logo-image">
                </div>
                <div class="copyright">
                    © 2025 Secure by Q. All rights reserved.
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
