<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURE MATCH | Secure by Q</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Background Q -->
    <div class="background-q">
        <img src="{{ url_for('static', filename='images/only_q.png') }}" alt="">
    </div>

    <nav class="main-nav">
        <div class="container">
            <div class="nav-content">
                <div class="logo-container">
                    <span class="logo-text">SECURE MATCH</span>
                </div>
                <ul class="nav-links">
                    <li><a href="{{ url_for('index') }}">Dashboard</a></li>
                    <li><a href="{{ url_for('brokers.broker_index') }}">Brokers</a></li>
                    <li><a href="#">Consultants</a></li>
                    <li><a href="#">Matches</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="hero">
        <div class="container">
            <div class="hero-content">
                <h1>MATCH<br>SECURE<br>DELIVER</h1>
                <p class="subtitle">Internal talent matching platform for Secure by Q, powered by intelligent matching algorithms.</p>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <img src="{{ url_for('static', filename='images/small_logo.png') }}" alt="Secure by Q" class="footer-logo">
            <p class="copyright">© 2024 Secure by Q. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
